<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0b1830">
  <title>Вход — ÜiirmeHub</title>
  <link rel="icon" type="image/png" href="/static/icon-192.png"><link rel="manifest" href="/static/site.webmanifest">
  <link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/nova.css">
  <script src="/static/i18n.js" defer></script><script src="/static/password-visibility.js" defer></script><script src="/static/premium-ui.js" defer></script><script src="/static/nova.js" defer></script>
</head>
<body class="auth-body login-minimal animated-login premium-auth">
  <div class="ambient-background" aria-hidden="true"><span class="ambient-orb orb-one"></span><span class="ambient-orb orb-two"></span><span class="ambient-orb orb-three"></span><span class="ambient-grid"></span><span class="ambient-ring ambient-ring-a"></span><span class="ambient-ring ambient-ring-b"></span></div>
  <main class="login-panel soft-entrance" aria-labelledby="clubium-login-heading">
    <div class="login-utility"><div data-language-slot></div></div>
    <div class="login-identity"><div class="login-logo-frame"><img class="clubium-logo clubium-logo-login shine-mark" src="/static/clubium-logo.png" width="106" height="106" alt=""></div>
      <h1 class="login-brand-name" id="clubium-login-heading">ÜiirmeHub</h1>
      <p class="login-caption">Вход в систему</p>
    </div>
    {% if error %}<div class="alert danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="form-stack login-form" id="clubium-login-form">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <label class="premium-field" for="login-username"><span class="field-label">Логин</span>
        <span class="input-with-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="login-username" required name="username" autocomplete="username" placeholder="Введите логин" autofocus></span>
      </label>
      <label class="premium-field" for="login-password"><span class="field-label">Пароль</span>
        <span class="password-field input-with-icon"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="login-password" required type="password" name="password" autocomplete="current-password" placeholder="Введите пароль"><button type="button" class="password-toggle" data-toggle-password="login-password" aria-controls="login-password" aria-pressed="false" aria-label="Показать пароль">Показать</button></span>
      </label>
      <button class="btn primary full login-submit" type="submit"><span>Войти</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
  </main>
</body>
</html>
